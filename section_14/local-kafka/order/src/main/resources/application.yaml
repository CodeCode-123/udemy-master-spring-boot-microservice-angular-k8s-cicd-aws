server:
  port: 9084

spring:
  profiles:
    active: local
  application:
    name: order

  kafka:
    bootstrap-servers: localhost:9092,localhost:9094

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        delivery:
          timeout:
            ms: 120000
        linger:
          ms: 0
        request:
          timeout:
            ms: 30000
        enable:
          idempotence: true
          max:
            in:
              flight:
                requests:
                  per:
                    connection: 5

    consumer:
      group-id: userinfo-service-userdto
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "com.codecode.order.dto"

app:
  service:
    url: "http://userservice/user/fetchUserById/"
  kafka:
    request-topic: "fetch-user-request"
    reply-topic: "fetch-user-reply"

