apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderapp
  template:
    metadata:
      labels:
        app: orderapp
    spec:
      containers:
        - name: orderapp
          image: codecode123/order-arm:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 9084
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Djdk.tls.client.protocols=TLSv1.2"
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: configmap
                  key: orderdb_url
            - name: SPRING_DATA_MONGODB_DATABASE
              value: "orderdb"

#            - name: MONGO_HOST
#              valueFrom:
#                configMapKeyRef:
#                  name: configmap
#                  key: orderdb_url
#            - name: SPRING_DATA_MONGODB_AUTO_INDEX_CREATION
#              valueFrom:
#                configMapKeyRef:
#                  name: configmap
#                  key: auto_index_creation

#      imagePullSecrets:
#        - name: dockerhub-secret

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: orderapp
  ports:
    - protocol: TCP
      port: 9084
      targetPort: 9084