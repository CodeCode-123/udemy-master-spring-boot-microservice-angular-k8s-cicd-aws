apiVersion: apps/v1
kind: Deployment
metadata:
  name: messageapp
  labels:
    app: messageapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messageapp
  template:
    metadata:
      labels:
        app: messageapp
    spec:
      containers:
        - name: messageapp
          image: codecode123/message-arm:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 9085
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-headless:9092" # Points directly to your internal Kafka pods

---
apiVersion: v1
kind: Service
metadata:
  name: message-service
spec:
  ports:
    - protocol: TCP
      port: 9085
      targetPort: 9085
  selector:
    app: messageapp